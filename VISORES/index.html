<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .info-leyenda {
          position: absolute;
          bottom: 30px;
          right: 20px;
          background: white;
          padding: 10px 15px;
          border-radius: 5px;
          box-shadow: 0 1px 5px rgba(0,0,0,0.4);
          font-family: Arial, sans-serif;
          font-size: 12px;
          line-height: 18px;
          z-index: 1000;
        }
        .info-leyenda i {
          width: 16px;
          height: 16px;
          float: left;
          margin-right: 8px;
          opacity: 0.8;
        }
		</style>
        <title>Susceptibilidad a la sismicidad - la Guaira, Vzla - </title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/EDF_AFECTADOS_2.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[10.526516391522964,-67.06573775071132],[10.671793367144321,-66.80194504443301]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Susceptibilidad a la sismicidad - la Guaira, Vzla - </h2>';
        };
        title.addTo(map);

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }

        map.createPane('pane_OpenTopoMap_0');
        map.getPane('pane_OpenTopoMap_0').style.zIndex = 400;
        var layer_OpenTopoMap_0 = L.tileLayer('https://a.tile.opentopomap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenTopoMap_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © OpenTopoMap (CC-BY-SA)</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        map.addLayer(layer_OpenTopoMap_0);

        map.createPane('pane_Susceptibilidad_clases_1');
        map.getPane('pane_Susceptibilidad_clases_1').style.zIndex = 401;
        var img_Susceptibilidad_clases_1 = 'data/Susceptibilidad_clases_1.png';
        var img_bounds_Susceptibilidad_clases_1 = [[10.577738105359352,-67.05934337437769],[10.629545870900506,-66.80850172586219]];
        var layer_Susceptibilidad_clases_1 = new L.imageOverlay(img_Susceptibilidad_clases_1,
                    img_bounds_Susceptibilidad_clases_1,
                    {pane: 'pane_Susceptibilidad_clases_1'});
        bounds_group.addLayer(layer_Susceptibilidad_clases_1);
        map.addLayer(layer_Susceptibilidad_clases_1);

        function pop_EDF_AFECTADOS_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ESA_CLASES'] !== null ? autolinker.link(String(feature.properties['ESA_CLASES']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_EDF_AFECTADOS_2_0() {
            return {
                pane: 'pane_EDF_AFECTADOS_2',
                radius: 3.199999999999997,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,0,0,1.0)',
                interactive: false,
            }
        }
        map.createPane('pane_EDF_AFECTADOS_2');
        map.getPane('pane_EDF_AFECTADOS_2').style.zIndex = 402;
        map.getPane('pane_EDF_AFECTADOS_2').style['mix-blend-mode'] = 'normal';
        var layer_EDF_AFECTADOS_2 = new L.geoJson(json_EDF_AFECTADOS_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_EDF_AFECTADOS_2',
            layerName: 'layer_EDF_AFECTADOS_2',
            pane: 'pane_EDF_AFECTADOS_2',
            onEachFeature: pop_EDF_AFECTADOS_2,
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, style_EDF_AFECTADOS_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_EDF_AFECTADOS_2);
        map.addLayer(layer_EDF_AFECTADOS_2);

        var overlaysTree = [
            {label: '<img src="legend/EDF_AFECTADOS_2.png" /> EDF_AFECTADOS', layer: layer_EDF_AFECTADOS_2},
            {label: "Susceptibilidad_clases", layer: layer_Susceptibilidad_clases_1},
            {label: "OpenTopoMap", layer: layer_OpenTopoMap_0},
        ];

        var lay = L.control.layers.tree(null, overlaysTree, {
            collapsed: false, 
        });
        lay.addTo(map);

		document.addEventListener("DOMContentLoaded", function() {
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight();
            });	

			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}

            setTimeout(function() { toggleLayerControl.click(); }, 10);
            setTimeout(function() { toggleLayerControl.click(); }, 10);

            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }       
        });       

        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>

        <!-- Leyenda Flotante de Susceptibilidad -->
        <div class="info-leyenda">
          <strong>Susceptibilidad</strong><br>
          <i style="background: #00ffff;"></i> BAJA<br>
          <i style="background: #ffff00;"></i> MODERADA<br>
          <i style="background: #ff8000;"></i> ALTA<br>
          <i style="background: #ff0000;"></i> MUY ALTA
        </div>
	</body>
</html>
